<aside class="sidebar" [class.open]="mobileOpen">
  <div class="brand">TaxPal</div>

  <nav>
    <a routerLink="/dashboard" routerLinkActive="active" (click)="onLinkClick()">🏠 Dashboard</a>
    <a routerLink="/transactions" routerLinkActive="active" (click)="onLinkClick()">🔁 Transactions</a>
    <a routerLink="/budgets" routerLinkActive="active" (click)="onLinkClick()">⏱ Budgets</a>
    <a routerLink="/tax-estimator" routerLinkActive="active" (click)="onLinkClick()">📄 Tax Estimator</a>
    <a routerLink="/reports" routerLinkActive="active" (click)="onLinkClick()">📊 Reports</a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <span class="avatar">{{ auth.currentUser()?.name?.charAt(0) }}</span>
      <div>
        <strong>{{ auth.currentUser()?.name }}</strong>
        <small>{{ auth.currentUser()?.email }}</small>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()">⎋ Logout</button>
  </div>
</aside>
