<div class="auth-container">
  <form class="auth-card" (ngSubmit)="onSubmit()" #signupForm="ngForm">
    <h1>Create your TaxPal account</h1>

    <label for="name">Full Name</label>
    <input id="name" name="name" [(ngModel)]="name" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required minlength="6" />

    <label for="country">Country</label>
    <input id="country" name="country" [(ngModel)]="country" required />

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>

    <p class="switch-link">Already have an account? <a routerLink="/login">Log in</a></p>
  </form>
</div>
