<div class="auth-container">
  <div class="auth-card">
    @if (!submitted) {
      <h1>Forgot your password?</h1>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>

      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required />

        <button type="submit" [disabled]="form.invalid">Send Reset Link</button>
      </form>
    } @else {
      <h1>Check your email</h1>
      <p class="subtitle">{{ message }}</p>

      @if (devResetLink) {
        <div class="dev-note">
          <strong>Dev note:</strong> no email backend is wired up yet, so here's the link
          that would normally be emailed:
          <a [href]="devResetLink">{{ devResetLink }}</a>
        </div>
      }
    }

    <p class="switch-link"><a routerLink="/login">← Back to login</a></p>
  </div>
</div>
