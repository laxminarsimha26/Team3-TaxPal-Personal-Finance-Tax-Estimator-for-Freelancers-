<div class="auth-container">
  <div class="auth-card">
    @if (!tokenValid) {
      <h1>Link expired</h1>
      <p class="subtitle">This reset link is invalid or has expired.</p>
      <p class="switch-link"><a routerLink="/forgot-password">Request a new link</a></p>
    } @else if (successMessage) {
      <h1>Success</h1>
      <p class="subtitle">{{ successMessage }}</p>
    } @else {
      <h1>Set a new password</h1>

      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <label for="newPassword">New Password</label>
        <input id="newPassword" name="newPassword" type="password" minlength="6"
               [(ngModel)]="newPassword" required />

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password"
               [(ngModel)]="confirmPassword" required />

        @if (errorMessage) {
          <p class="error">{{ errorMessage }}</p>
        }

        <button type="submit" [disabled]="form.invalid">Reset Password</button>
      </form>
    }
  </div>
</div>
